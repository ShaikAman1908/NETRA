<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netra</title>
    <link rel="stylesheet" href="StyleNetra.css">
    <script src="/NETRA Project/ScriptNetra.js"></script>
</head>

<body>
    <header class="topbar">

        <div class="brand">
            <div class="brand-logo">N</div>
            <div class="brand-name">
                <h1>NETRA</h1>
                <p>ROBOT MISSION CONTROL</p>
            </div>
        </div>
        
        <nav>

            <a href="#dashboard">Dashboard</a>
            <a href="#fleet">Fleet</a>
            <a href="#telemetry">Telemetry</a>
            <a href="#alerts">Alerts</a>

        </nav>

        <div class="header-right">
            <span class="online-dot"></span>
            <span>SYSTEM ONLINE</span>
            <!-- Span Tag keeps the contents in the same line!!!... -->
            <strong id="clock">--:--:--</strong>
            <!-- Strong mean we will be getting bold!!!... -->
        </div>

        <button id="dispatch-open" type="button">+DISPATCH MISSION</button>
        <!-- For button tag, we must keep the id and the name/type by default -->
    </header>

    


    <main class="page">
        <!-- KPI CARDS -->
         <section class="kpi-grid">

            <article class="kpi-card">
                <span>ROVERS ONLINE</span>
                <h2 id="online-count">6 / 6</h2>
                <p>Active Rover Units</p>
            </article>

            <article class="kpi-card">
                <span>AVERAGE BATTERY</span>
                <h2 id="average-battery">67%</h2>
                <p>Fleet Battery Level</p>
            </article>

            <article class="kpi-card">
                <span>OPEN AERTS</span>
                <h2 id="alert-count">1</h2>
                <p>Requires Attention</p>
            </article>

            <article class="kpi-card">
                <span>DISTANCE TODAY</span>
                <h2 id="distance">13.6 km</h2>
                <p>Total Simulated Distance</p>
            </article>

         </section>
    </main>
    
</body>

</html>
